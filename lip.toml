format = 4
id = "github.com/LiteLDev/LeviSchematic"
version = "0.0.0"

[info]
name = "LeviSchematic"
description = "LeviSchematic is a Bedrock client-side schematic projection mod built around `.mcstructure` files."
tags = ["utility"]

# LeviSchematic is a client-only mod: the default variant has only a client entry.
# The client entry depends on github.com/LiteLDev/LeviLamina#client because LeviLamina 26.51.* is
# released with tooth.json only; switch it to bare github.com/LiteLDev/LeviLamina once a lip.toml
# LeviLamina release is targeted.

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.51.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LeviSchematic-client-windows-x64.zip"]
place = [{ src = "LeviSchematic/", dest = "mods/LeviSchematic/" }]
