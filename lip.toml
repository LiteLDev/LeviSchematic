format = 4
id = "github.com/LiteLDev/LeviSchematic"
version = "0.0.0"

[info]
name = "LeviSchematic"
description = "LeviSchematic is a Bedrock client-side schematic projection mod built around `.mcstructure` files."
tags = ["utility"]

# LeviSchematic is a client-only mod. The default variant and the variant "client" (the one
# LeviLauncher installs first, and the one tooth.json had) hold the same client entry.

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.51.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LeviSchematic-client-windows-x64.zip"]
place = [{ src = "LeviSchematic/", dest = "mods/LeviSchematic/" }]

[[variants.client]]
side = "client"
platform = "win-x64"

[variants.client.deps]
"github.com/LiteLDev/LeviLamina#client" = "26.51.*"

[[variants.client.assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LeviSchematic-client-windows-x64.zip"]
place = [{ src = "LeviSchematic/", dest = "mods/LeviSchematic/" }]
